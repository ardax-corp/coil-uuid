name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout coil-lang
        uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-lang
          path: .ci/coil-lang
          submodules: false

      - name: Checkout coil-crypto
        uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-crypto
          path: .ci/coil-crypto
          submodules: false

      - name: Checkout coil-time
        uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-time
          path: .ci/coil-time
          submodules: false

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .ci/coil-lang
            .ci/coil-crypto/native

      - name: Build coil
        run: cargo build --bin coil --manifest-path .ci/coil-lang/Cargo.toml

      - name: Native crypto
        run: make
        working-directory: .ci/coil-crypto

      - name: Place libcrypto.so on FFI search path
        working-directory: .ci/coil-crypto
        run: cp native/target/release/libcrypto.so native/

      - name: Language harness (`coil test`)
        run: |
          .ci/coil-lang/target/debug/coil test \
            --allow-dload crypto \
            --ffi-search-path .ci/coil-crypto/native \
            --root .ci/coil-crypto/src \
            --root .ci/coil-time/src
